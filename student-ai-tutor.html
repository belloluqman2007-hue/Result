<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Learning Tutor | Ameenullah School</title>
  <!-- NEW (pack 37 - owner: "give student ai chat for learning at home"):
       the child's own AI chat. Same friendly chat look as the staff AI,
       but this one is a PATIENT TUTOR - it explains lessons, gives
       practice questions and quizzes gently. It lives in the Student &
       Parent Portal; students and parents log in with Student ID +
       surname. The AI never sees (and never talks about) private result
       or fee records - it only teaches. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5021">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    /* WhatsApp-style tutor chat chrome - same look as the staff AI chat */
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family:'Segoe UI', Arial, sans-serif; color:#1f2d26;
      background:#dfe5dd;
      display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    }
    /* ---------- top bar ---------- */
    .tut-top{
      background:linear-gradient(120deg,#14291c,#1d4a30 55%,#276b43); color:#fff;
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      box-shadow:0 2px 10px rgba(0,0,0,.18); z-index:20; flex:0 0 auto;
    }
    .tut-back{
      color:#fff; text-decoration:none; font-size:20px; line-height:1;
      padding:6px 8px; border-radius:9px; background:rgba(255,255,255,.10); font-weight:700;
    }
    .tut-avatar{
      width:40px; height:40px; border-radius:50%; flex:0 0 40px;
      background:linear-gradient(135deg,#f3c94e,#d9a419);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,.25); font-size:21px;
    }
    .tut-who{ min-width:0; }
    .tut-who b{ font-size:15.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tut-who small{ font-size:11.5px; opacity:.9; display:flex; align-items:center; gap:5px; }
    .tut-dot{ width:7px; height:7px; border-radius:50%; background:#6fe08f; display:inline-block; box-shadow:0 0 0 3px rgba(111,224,143,.22); }
    .tut-dot.off{ background:#d9d9d9; box-shadow:none; }
    .tut-top .sp{ flex:1; }
    .tut-iconbtn{
      border:none; background:rgba(255,255,255,.13); color:#fff; cursor:pointer;
      border-radius:10px; padding:8px 10px; font-size:14px; font-weight:800; line-height:1;
      display:flex; align-items:center; gap:6px;
    }
    .tut-iconbtn:hover{ background:rgba(255,255,255,.22); }

    /* ---------- chat area ---------- */
    .tut-log{
      flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 10px 8px;
      background:
        radial-gradient(circle at 12% 20%, rgba(20,83,45,.045) 0 26px, transparent 27px),
        radial-gradient(circle at 85% 65%, rgba(20,83,45,.05) 0 22px, transparent 23px),
        radial-gradient(circle at 55% 90%, rgba(217,164,25,.05) 0 28px, transparent 29px),
        #dfe5dd;
    }
    .tut-col{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:3px; }

    .tut-msg{ display:flex; margin:7px 0; gap:8px; align-items:flex-end; }
    .tut-msg .bot-ic{
      width:28px; height:28px; border-radius:50%; flex:0 0 28px;
      background:linear-gradient(135deg,#f3c94e,#d9a419); color:#231a02;
      display:flex; align-items:center; justify-content:center; font-size:15px;
      box-shadow:0 1px 3px rgba(0,0,0,.2);
      align-self:flex-start; margin-top:2px;
    }
    .tut-bub{
      max-width:82%; padding:8px 11px 6px; border-radius:12px; position:relative;
      box-shadow:0 1px 2px rgba(0,0,0,.13); font-size:14.5px; line-height:1.5;
      word-break:break-word;
    }
    .tut-msg.bot .tut-bub{ background:#ffffff; border-bottom-left-radius:4px; }
    .tut-msg.me{ justify-content:flex-end; }
    .tut-msg.me .tut-bub{ background:#d9fdd3; border-bottom-right-radius:4px; }
    .tut-body{ min-width:0; }
    .tut-meta{ float:right; margin:8px -3px -2px 10px; font-size:10.5px; color:#849687; display:inline-flex; align-items:center; gap:3px; height:12px; position:relative; bottom:-4px; }
    .tut-copy{
      display:inline-flex; align-items:center; gap:4px; margin-top:5px; border:none; background:none; cursor:pointer;
      color:#8aa093; font-size:11px; font-weight:700; padding:2px 0;
    }
    .tut-copy svg{ width:12px; height:12px; display:block; }
    .tut-copy:hover{ color:#14532d; }

    /* typing indicator */
    .tut-typing .tut-bub{ display:flex; gap:5px; padding:13px 14px; }
    .tut-typing .dt{ width:8px; height:8px; border-radius:50%; background:#9ab0a3; animation:tutb 1.2s infinite; }
    .tut-typing .dt:nth-child(2){ animation-delay:.15s; } .tut-typing .dt:nth-child(3){ animation-delay:.3s; }
    @keyframes tutb{ 0%,60%,100%{ transform:translateY(0); opacity:.5 } 30%{ transform:translateY(-5px); opacity:1 } }

    /* day chip + welcome */
    .tut-chipday{ align-self:center; background:#fdf3cd; color:#5d5316; font-size:11.5px; font-weight:700;
      padding:5px 12px; border-radius:9px; box-shadow:0 1px 2px rgba(0,0,0,.08); margin:6px auto 10px; }
    .tut-welcome{
      background:#fff; border:1px solid #e6ece8; border-radius:16px; padding:18px 16px; margin:6px 4px 10px;
      box-shadow:0 2px 10px rgba(20,41,28,.06); text-align:center;
    }
    .tut-welcome .big{
      width:58px; height:58px; margin:0 auto 10px; border-radius:18px;
      background:linear-gradient(135deg,#f3c94e,#d9a419);
      display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(217,164,25,.35);
      font-size:30px;
    }
    .tut-welcome h2{ margin:0 0 4px; font-size:17px; color:#14532d; }
    .tut-welcome p{ margin:0 auto 12px; font-size:13px; color:#5B6B62; line-height:1.55; max-width:480px; }
    .tut-sugg{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .tut-sugg button{
      border:1.5px solid #cfe0c9; background:#f2f8f0; color:#1d4a30; border-radius:999px;
      padding:8px 13px; font-size:12.5px; font-weight:700; cursor:pointer; text-align:left;
    }
    .tut-sugg button:hover{ background:#e3f0dd; border-color:#9dc48e; }
    .tut-note{ font-size:11.5px; color:#93a19a; margin-top:12px; line-height:1.5; }

    /* ---------- composer ---------- */
    .tut-compose{
      flex:0 0 auto; background:#e9efe9; padding:9px 10px calc(9px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 10px rgba(0,0,0,.06);
    }
    .tut-composerow{ max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
    .tut-input{
      flex:1; border:none; resize:none; outline:none; border-radius:22px; padding:11px 15px;
      font-size:14.5px; font-family:inherit; line-height:1.4; max-height:132px; background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.10);
    }
    .tut-send{
      width:46px; height:46px; border:none; border-radius:50%; cursor:pointer; flex:0 0 46px;
      background:linear-gradient(135deg,#1d6a3a,#0f6a44); color:#fff;
      display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(20,83,45,.35);
    }
    .tut-send:disabled{ opacity:.45; cursor:default; }
    .tut-send svg{ width:21px; height:21px; margin-left:-2px; }

    @media (max-width:520px){
      .tut-bub{ max-width:88%; }
      .tut-who b{ font-size:14px; }
    }
  </style>
</head>
<body>
  <header class="tut-top">
    <a class="tut-back" href="portal.html" title="Back to the portal">&#8592;</a>
    <span class="tut-avatar">&#127891;</span>
    <div class="tut-who">
      <b>AI Learning Tutor</b>
      <small><span class="tut-dot off" id="tutDot"></span><span id="tutState">checking&hellip;</span></small>
    </div>
    <span class="sp"></span>
    <button class="tut-iconbtn" id="tutNewBtn" type="button" title="Start a new lesson">&#9998; New</button>
  </header>

  <main class="tut-log" id="tutLog">
    <div class="tut-col" id="tutCol">
      <div class="tut-chipday">Today</div>
      <!-- welcome / coming-soon card is injected by js/student-ai-tutor.js -->
      <div id="tutLanding"></div>
    </div>
  </main>

  <footer class="tut-compose">
    <div class="tut-composerow">
      <textarea class="tut-input" id="tutInput" rows="1" placeholder="Ask the tutor anything&hellip; e.g. explain fractions" aria-label="Ask the AI tutor"></textarea>
      <button class="tut-send" id="tutSend" type="button" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.81-.35.81-1.46 0-1.81L3.4 3.6c-.66-.29-1.39.2-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.89c-.5.06-.87.49-.87.99l.01 4.6c0 .72.73 1.2 1.39.92z"/></svg>
      </button>
    </div>
  </footer>

  <script src="js/csrf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/student-ai-tutor.js"></script>
</body>
</html>
