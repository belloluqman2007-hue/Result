<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Book | Ameenullah School of Arabic and Islamic Studies</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-ui.css">
  <link rel="stylesheet" href="css/manage.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5021">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    .gb-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:16px; }
    .gb-field{ display:flex; flex-direction:column; gap:5px; min-width:160px; }
    .gb-field label{ font-size:12px; font-weight:700; color:var(--m-emerald,#0F3D2E); }
    .gb-field select,.gb-field input{
      padding:10px 12px; border:1.5px solid var(--m-border,#D9E8E0); border-radius:10px;
      background:var(--m-surface-2,#F6FAF8); font-family:inherit; font-size:14px;
    }
    .gb-wrap{ overflow:auto; border:1px solid var(--m-border,#D9E8E0); border-radius:14px; background:#fff; max-height:70vh; }
    table.gb{
      border-collapse:separate; border-spacing:0; min-width:640px; font-size:13px; background:#fff;
    }
    table.gb th, table.gb td{
      border-bottom:1px solid #d7e4db; border-right:1px solid #e6eee9;
      padding:7px 8px; text-align:center; white-space:nowrap;
    }
    table.gb thead th{
      position:sticky; top:0; z-index:3;
      background:linear-gradient(135deg,#0F3D2E,#1C5A42); color:#F3E7C3;
      font-size:11.5px; letter-spacing:.2px;
    }
    table.gb td.gb-name, table.gb th.gb-name{
      position:sticky; left:0; z-index:2; text-align:left; min-width:170px;
      background:#fff; font-weight:700;
    }
    table.gb thead th.gb-name{ z-index:4; background:#0F3D2E; }
    table.gb tr:nth-child(even) td{ background:#F6FAF8; }
    table.gb tr:nth-child(even) td.gb-name{ background:#F6FAF8; }
    table.gb td.gb-cell{ min-width:92px; vertical-align:middle; }
    table.gb td.gb-cell:focus-within{ outline:2px solid #2F9E6E; outline-offset:-2px; }
    .gb-edit{ display:flex; gap:4px; justify-content:center; }
    table.gb td.gb-cell input{
      width:44px; padding:5px 4px; border:1.5px solid #9cc9b3; border-radius:6px;
      text-align:center; font-size:13px; font-family:inherit; background:#fff;
    }
    table.gb td.gb-cell input:focus{ border-color:#2F9E6E; outline:none; }
    .gb-tot{ margin-top:3px; font-size:11px; font-weight:700; color:#0F3D2E; }
    .gb-subh{ font-weight:500; font-size:10px; opacity:.85; margin-top:2px; }
    .gb-id{ font-weight:500; color:#5F6E66; font-size:11px; }
    html[data-theme="dark"] table.gb td.gb-cell input{ background:var(--m-surface-2); color:var(--m-text); border-color:#2d5a38; }
    html[data-theme="dark"] .gb-tot, html[data-theme="dark"] .gb-id{ color:var(--m-muted,#a8c4b0); }
    table.gb td.gb-saving{ opacity:.55; }
    table.gb td.gb-ok{ background:#E8F6EE !important; }
    table.gb td.gb-err{ background:#FDECEC !important; }
    .gb-note{ font-size:12.5px; color:var(--m-muted,#5F6E66); margin-top:10px; }
    html[data-theme="dark"] table.gb td.gb-name,
    html[data-theme="dark"] table.gb tr:nth-child(even) td.gb-name,
    html[data-theme="dark"] .gb-wrap,
    html[data-theme="dark"] table.gb{ background:var(--m-surface); color:var(--m-text); }
    html[data-theme="dark"] table.gb tr:nth-child(even) td{ background:var(--m-surface-2); }
  </style>
</head>
<body onload="checkAuth(); gbInit();">
  <div class="mng-page" style="max-width:1240px;">
    <div class="mng-head">
      <a class="mng-back" href="teacher-dashboard.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Dashboard
      </a>
      <div class="mng-head-text">
        <h1>Grade Book</h1>
        <p>Every student in the class has CA and Exam boxes you can type in. Scores save when you leave a box.</p>
      </div>
    </div>

    <div class="mng-card">
      <div class="gb-toolbar">
        <div class="gb-field">
          <label for="gbClass">Class</label>
          <select id="gbClass"><option value="">Select class…</option></select>
        </div>
        <div class="gb-field">
          <label for="gbTerm">Term</label>
          <select id="gbTerm">
            <option>1st Term</option>
            <option>2nd Term</option>
            <option>3rd Term</option>
          </select>
        </div>
        <div class="gb-field">
          <label for="gbSession">Session</label>
          <select id="gbSession"><option value="">Loading…</option></select>
        </div>
        <button type="button" class="mng-btn mng-btn-sm" onclick="gbLoad()">Load Grade Book</button>
        <button type="button" class="mng-btn mng-btn-ghost mng-btn-sm" onclick="gbExport()">Export Excel</button>
      </div>
      <div id="gbStatus" class="gb-note">Pick a class, term and session, then load.</div>
      <div class="gb-wrap" id="gbWrap" style="display:none;">
        <table class="gb" id="gbTable"></table>
      </div>
    </div>
  </div>

  <script src="js/csrf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gradebook.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
