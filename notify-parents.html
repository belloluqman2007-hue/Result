<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notify Parents | Ameenullah School of Arabic and Islamic Studies</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-ui.css">
  <link rel="stylesheet" href="css/manage.css">
  <link rel="stylesheet" href="css/school.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5021">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body onload="checkAuth(); initNotify();">
  <div class="mng-page">

    <div class="mng-head">
      <a class="mng-back" href="teacher-dashboard.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Dashboard
      </a>
      <div class="mng-head-text">
        <h1>&#128226; Notify Parents</h1>
        <p>Send one message to parents at once. Their phones ring (push alert) and you get ready-made WhatsApp / SMS links to forward.</p>
      </div>
    </div>

    <div class="mg-cards">

      <div class="mg-card">
        <h3>&#128172; Compose Message</h3>
        <div class="mg-toolbar">
          <div class="mg-field">
            <label for="ntAudience">Audience</label>
            <select id="ntAudience" onchange="ntAudienceChanged()">
              <option value="all">All active students</option>
              <option value="class">One class</option>
              <option value="debtors">Fee debtors</option>
            </select>
          </div>
          <div class="mg-field" id="ntClassWrap" style="display:none;">
            <label for="ntClass">Class</label>
            <select id="ntClass"><option value="">Loading classes...</option></select>
          </div>
        </div>
        <div class="mg-toolbar" id="ntTermWrap" style="display:none;">
          <div class="mg-field">
            <label for="ntTerm">Term</label>
            <select id="ntTerm">
              <option>1st Term</option><option>2nd Term</option><option>3rd Term</option>
            </select>
          </div>
          <div class="mg-field">
            <label for="ntSession">Session</label>
            <select id="ntSession">
              <option>2025/2026</option><option>2026/2027</option><option>2027/2028</option><option>2028/2029</option><option>2029/2030</option>
            </select>
          </div>
        </div>
        <div class="mg-field" style="margin:10px 0;">
          <label for="ntMessage">Message <span style="color:#B3261E;">*</span></label>
          <textarea id="ntMessage" rows="4" placeholder="e.g. Salam alaykum. Please note that school fees for this term are now due. Kindly pay before the due date. Jazakumullahu khairan." style="width:100%; padding:10px 12px; border:1.5px solid #c8d6ca; border-radius:8px; font-size:14px; font-family:inherit; resize:vertical;"></textarea>
        </div>
        <button class="mg-btn" type="button" onclick="sendNotify()">&#128276; Send Alerts &amp; Get Links</button>
        <div id="ntResult" style="margin-top:12px;"></div>
      </div>
    </div>

    <div class="mg-msg" id="ntMsg"></div>
  </div>

  <script src="js/csrf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notify-parents.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
