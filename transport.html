<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transport Management | Admin</title>
<link rel="stylesheet" href="css/mgmt.css">
<style>
.tr-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.tr-input{width:100%;padding:9px 12px;border:1.5px solid #c8d6ca;border-radius:9px;font-family:inherit;font-size:14px;margin-bottom:9px;background:#f7faf7;box-sizing:border-box;}
.tr-btn{background:linear-gradient(135deg,#1d4a30,#2f7a4e);color:#fff;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.tr-item{background:#f7faf7;border:1.5px solid #d3e8d6;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.tr-del{background:none;border:1.5px solid #f0b8b8;color:#9b1c1c;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;float:right;}
.tr-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
</style>
</head>
<body>
<header style="background:linear-gradient(120deg,#14291c,#1d4a30,#276b43);color:#fff;display:flex;align-items:center;gap:10px;padding:11px 14px;">
  <a href="teacher-dashboard.html" style="color:#fff;text-decoration:none;font-size:20px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 9px;border-radius:9px;">&#8592;</a>
  <div style="font-size:36px;">🚌</div>
  <div><b style="font-size:16px;">Transport Management</b><br><small style="opacity:.8;">Manage bus routes and student assignments</small></div>
</header>
<div style="max-width:700px;margin:16px auto;padding:0 14px;">
  <div class="tr-card">
    <h2 style="font-size:15px;font-weight:800;color:#14291c;margin:0 0 12px;">Add Bus Route</h2>
    <input class="tr-input" type="text" id="trName" placeholder="Route name (e.g. Ijebu-Ode South Route)">
    <div class="tr-2col">
      <input class="tr-input" type="text" id="trBus" placeholder="Bus number (e.g. BUS-01)">
      <input class="tr-input" type="text" id="trDriver" placeholder="Driver name">
    </div>
    <div class="tr-2col">
      <input class="tr-input" type="text" id="trPhone" placeholder="Driver phone">
      <input class="tr-input" type="text" id="trPickup" placeholder="Morning pick-up time">
    </div>
    <input class="tr-input" type="text" id="trDropoff" placeholder="Afternoon drop-off time">
    <button class="tr-btn" onclick="trAddRoute()">🚌 Add Route</button>
    <div id="trRouteMsg" style="text-align:center;font-size:13px;min-height:18px;margin-top:6px;"></div>
  </div>
  <div class="tr-card">
    <h2 style="font-size:15px;font-weight:800;color:#14291c;margin:0 0 10px;">Existing Routes</h2>
    <div id="trRouteList" style="color:#5B6B62;text-align:center;padding:10px;">Loading...</div>
  </div>
  <div class="tr-card">
    <h2 style="font-size:15px;font-weight:800;color:#14291c;margin:0 0 12px;">Assign Student to Route</h2>
    <input class="tr-input" type="text" id="trStudentId" placeholder="Student Admission Number">
    <select class="tr-input" id="trRouteSelect"><option value="">Select Route...</option></select>
    <input class="tr-input" type="text" id="trPickupPoint" placeholder="Student's pick-up point/stop (optional)">
    <button class="tr-btn" onclick="trAssign()">✅ Assign Student</button>
    <div id="trAssignMsg" style="text-align:center;font-size:13px;min-height:18px;margin-top:6px;"></div>
  </div>
</div>
<script src="js/csrf.js"></script>
<script src="js/ui.js"></script>
<script>
var routes=[];
function trLoadRoutes(){
  fetch("/api/transport/routes",{credentials:"same-origin"}).then(r=>r.json()).then(rows=>{
    routes=rows||[];
    var sel=document.getElementById("trRouteSelect");
    sel.innerHTML='<option value="">Select Route...</option>'+rows.map(r=>'<option value="'+r.id+'">'+r.route_name+'</option>').join("");
    var box=document.getElementById("trRouteList");
    if(!rows.length){box.textContent="No routes yet.";return;}
    box.innerHTML=rows.map(r=>'<div class="tr-item">'+
      '<button class="tr-del" onclick="trDelRoute('+r.id+')">Delete</button>'+
      '<b style="font-size:14px;color:#14291c;">'+r.route_name+'</b>'+
      '<div style="font-size:12px;color:#3a5441;margin-top:4px;">🚌 '+r.bus_number+' · 👨‍✈️ '+r.driver_name+' · 📞 '+r.driver_phone+'</div>'+
      '<div style="font-size:12px;color:#5B6B62;">🌅 '+r.pickup_time+' · 🌆 '+r.dropoff_time+'</div></div>').join("");
  });
}
function trAddRoute(){
  var name=document.getElementById("trName").value.trim();
  var msg=document.getElementById("trRouteMsg");
  if(!name){msg.textContent="Route name required.";msg.style.color="#9b1c1c";return;}
  fetch("/api/transport/routes",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({route_name:name,bus_number:document.getElementById("trBus").value,
    driver_name:document.getElementById("trDriver").value,driver_phone:document.getElementById("trPhone").value,
    pickup_time:document.getElementById("trPickup").value,dropoff_time:document.getElementById("trDropoff").value})})
    .then(r=>r.json()).then(d=>{msg.textContent=d.message||"Added!";msg.style.color="#14532d";
    ["trName","trBus","trDriver","trPhone","trPickup","trDropoff"].forEach(id=>{document.getElementById(id).value="";});
    trLoadRoutes();setTimeout(()=>{msg.textContent="";},3000);
  }).catch(()=>{msg.textContent="Error.";msg.style.color="#9b1c1c";});
}
function trDelRoute(id){if(!confirm("Delete this route?"))return;fetch("/api/transport/routes/"+id,{method:"DELETE",credentials:"same-origin"}).then(()=>trLoadRoutes());}
function trAssign(){
  var sid=document.getElementById("trStudentId").value.trim();
  var rid=document.getElementById("trRouteSelect").value;
  var pt=document.getElementById("trPickupPoint").value.trim();
  var msg=document.getElementById("trAssignMsg");
  if(!sid||!rid){msg.textContent="Student ID and route required.";msg.style.color="#9b1c1c";return;}
  fetch("/api/transport/assign",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({student_id:sid,route_id:rid,pickup_point:pt})})
    .then(r=>r.json()).then(d=>{msg.textContent=d.message||"Assigned!";msg.style.color="#14532d";setTimeout(()=>{msg.textContent="";},3000);})
    .catch(()=>{msg.textContent="Error.";msg.style.color="#9b1c1c";});
}
trLoadRoutes();
</script>
</body></html>
