<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline Records | Ameenullah School of Arabic and Islamic Studies</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-ui.css">
  <link rel="stylesheet" href="css/manage.css">
  <link rel="stylesheet" href="css/school.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5021">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body onload="checkAuth(); initDiscipline();">
  <div class="mng-page">

    <div class="mng-head">
      <a class="mng-back" href="teacher-dashboard.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Dashboard
      </a>
      <div class="mng-head-text">
        <h1>&#128218; Discipline Records</h1>
        <p>Log warnings, suspensions and commendations per student. Parents see their child's record in the portal.</p>
      </div>
    </div>

    <div class="mg-cards">

      <!-- Log a record -->
      <div class="mg-card">
        <h3>&#10133; Log a Record</h3>
        <div class="mg-toolbar">
          <div class="mg-field" style="min-width:min(100%,300px);">
            <label for="dcStudent">Student</label>
            <select id="dcStudent"><option value="">Loading students...</option></select>
          </div>
          <div class="mg-field">
            <label for="dcType">Type</label>
            <select id="dcType">
              <option value="warning">Warning</option>
              <option value="suspension">Suspension</option>
              <option value="commendation">Commendation</option>
            </select>
          </div>
          <div class="mg-field">
            <label for="dcDate">Date</label>
            <input type="date" id="dcDate">
          </div>
        </div>
        <div class="mg-field" style="margin:8px 0;">
          <label for="dcTitle">Title (optional)</label>
          <input type="text" id="dcTitle" placeholder="e.g. Late to class" autocomplete="off">
        </div>
        <div class="mg-field">
          <label for="dcDesc">Description <span style="color:#B3261E;">*</span></label>
          <textarea id="dcDesc" rows="3" placeholder="Describe what happened..." style="width:100%; padding:9px 11px; border:1.5px solid #c8d6ca; border-radius:8px; font-size:14px; font-family:inherit; resize:vertical;"></textarea>
        </div>
        <button class="mg-btn" type="button" onclick="saveDiscipline()" style="margin-top:10px;">&#128190; Save Record</button>
      </div>

      <!-- Records list -->
      <div class="mg-card">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <h3 style="margin:0;">&#128203; Records</h3>
          <span style="margin-left:auto; display:flex; gap:8px; align-items:center;">
            <select id="dcFilter" onchange="loadDiscipline()" style="padding:8px 11px; border:1.5px solid #c8d6ca; border-radius:8px; font-family:inherit; font-size:13px;">
              <option value="">All Students</option>
            </select>
          </span>
        </div>
        <div class="mg-table-wrap">
          <table class="mg-table" id="dcTable">
            <thead><tr><th>Date</th><th>Student</th><th>Type</th><th>Title</th><th>Description</th><th>Recorded By</th><th></th></tr></thead>
            <tbody><tr><td colspan="7" style="text-align:center; color:#5B6B62;">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="mg-msg" id="dcMsg"></div>
  </div>

  <script src="js/csrf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/discipline.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
