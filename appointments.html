<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments | Ameenullah School of Arabic and Islamic Studies</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern-ui.css">
  <link rel="stylesheet" href="css/manage.css">
  <link rel="stylesheet" href="css/school.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f5021">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body onload="checkAuth(); initAppts();">
  <div class="mng-page">

    <div class="mng-head">
      <a class="mng-back" href="teacher-dashboard.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Dashboard
      </a>
      <div class="mng-head-text">
        <h1>&#128197; Parent–Teacher Appointments</h1>
        <p>Review meeting requests sent by parents and approve or reject them.</p>
      </div>
    </div>

    <div class="mg-cards">

      <div class="mg-card">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <h3 style="margin:0;">&#128203; Requests</h3>
          <span style="margin-left:auto;">
            <select id="apFilter" onchange="loadAppts()" style="padding:8px 11px; border:1.5px solid #c8d6ca; border-radius:8px; font-family:inherit; font-size:13px;">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
            </select>
          </span>
        </div>
        <div class="mg-table-wrap">
          <table class="mg-table" id="apTable">
            <thead><tr><th>Student</th><th>Class</th><th>Parent</th><th>Requested</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody><tr><td colspan="7" style="text-align:center; color:#5B6B62;">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="mg-msg" id="apMsg"></div>
  </div>

  <script src="js/csrf.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
