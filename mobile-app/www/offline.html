<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Ameenullah School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #164A37 0%, #0B2E22 60%, #061A13 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      color: #1f2d26;
      border-radius: 22px;
      padding: 34px 26px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
    }
    .logo-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 6px;
      background: #fff;
      box-shadow: 0 0 0 3px #0B2E22;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .school {
      font-size: 0.75rem;
      color: #2f5021;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.32rem;
      color: #0B2E22;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.92rem;
      line-height: 1.52;
      color: #526159;
      margin-bottom: 22px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0B2E22, #1c5740);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 13px 26px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary {
      background: #f1f5f3;
      color: #0B2E22;
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="logo.jpg" alt="Ameenullah School Logo">
    </div>
    <div class="school">Ameenullah School of Arabic &amp; Islamic Studies</div>
    <h1>Connection Interrupted</h1>
    <p>Your phone lost connection to the school server. Your records and results are safe in the cloud &mdash; check your network and reconnect.</p>
    <div class="actions">
      <button type="button" class="btn-primary" id="reconnectBtn">&#128260; Reconnect to Portal</button>
      <button type="button" class="btn-secondary" id="checkResultBtn">&#128202; Go to Result Checker</button>
    </div>
  </div>
  <script>
    document.getElementById("reconnectBtn").addEventListener("click", function () {
      window.location.replace("index.html");
    });
    document.getElementById("checkResultBtn").addEventListener("click", function () {
      window.location.replace("index.html?path=/portal-login.html");
    });
    window.addEventListener("online", function () {
      window.location.replace("index.html");
    });
  </script>
</body>
</html>
