<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Broadcasts | School Admin</title>
<link rel="stylesheet" href="css/mgmt.css">
<style>
.bc-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.bc-form input,.bc-form textarea,.bc-form select{width:100%;padding:9px 12px;border:1.5px solid #c8d6ca;border-radius:9px;font-family:inherit;font-size:14px;margin-bottom:9px;background:#f7faf7;}
.bc-form textarea{min-height:90px;resize:vertical;}
.bc-btn{background:linear-gradient(135deg,#1d4a30,#2f7a4e);color:#fff;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.bc-item{background:#f7faf7;border:1.5px solid #d3e8d6;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.bc-pin{background:#fffbeb;border-color:#f3c94e;}
.bc-del{background:none;border:1.5px solid #f0b8b8;color:#9b1c1c;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;float:right;}
.msg{text-align:center;font-size:13px;min-height:18px;margin:6px 0;}
</style>
</head>
<body>
<header style="background:linear-gradient(120deg,#14291c,#1d4a30,#276b43);color:#fff;display:flex;align-items:center;gap:10px;padding:11px 14px;">
  <a href="teacher-dashboard.html" style="color:#fff;text-decoration:none;font-size:20px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 9px;border-radius:9px;">&#8592;</a>
  <div style="font-size:36px;">📢</div>
  <div><b style="font-size:16px;">School Broadcasts</b><br><small style="opacity:.8;">Send important announcements to all parents</small></div>
</header>
<div style="max-width:700px;margin:16px auto;padding:0 14px;">
  <div class="bc-card">
    <h2 style="font-size:15px;font-weight:800;color:#14291c;margin:0 0 12px;">New Broadcast</h2>
    <div class="bc-form">
      <input type="text" id="bcTitle" placeholder="Announcement title (e.g. School Closure Notice)">
      <textarea id="bcMsg" placeholder="Write your message here..."></textarea>
      <label style="font-size:13px;color:#3a5441;display:flex;align-items:center;gap:8px;margin-bottom:9px;">
        <input type="checkbox" id="bcPinned" style="width:auto;margin:0;"> Pin this announcement (shows at top for all parents)
      </label>
      <button class="bc-btn" onclick="bcPost()">📢 Send to All Parents</button>
      <div class="msg" id="bcMsg2"></div>
    </div>
  </div>
  <div class="bc-card">
    <h2 style="font-size:15px;font-weight:800;color:#14291c;margin:0 0 10px;">Sent Broadcasts</h2>
    <div id="bcList" style="color:#5B6B62;text-align:center;padding:10px;">Loading...</div>
  </div>
</div>
<script src="js/csrf.js"></script>
<script src="js/ui.js"></script>
<script>
function bcLoad(){
  fetch("/api/broadcasts",{credentials:"same-origin"}).then(r=>r.json()).then(rows=>{
    var box=document.getElementById("bcList");
    if(!rows.length){box.textContent="No broadcasts yet.";return;}
    box.innerHTML=rows.map(b=>'<div class="bc-item'+(b.pinned?" bc-pin":"")+'">'+
      '<button class="bc-del" onclick="bcDelete('+b.id+')">Delete</button>'+
      (b.pinned?'<span style="font-size:11px;font-weight:800;color:#92400e;">📌 PINNED</span><br>':'')+
      '<b style="font-size:14px;color:#14291c;">'+b.title+'</b>'+
      '<p style="font-size:13px;color:#3a5441;margin:5px 0;">'+b.message+'</p>'+
      '<span style="font-size:11px;color:#99b09e;">'+new Date(b.created_at).toLocaleString()+'</span></div>').join("");
  }).catch(()=>{document.getElementById("bcList").textContent="Error loading.";});
}
function bcPost(){
  var title=document.getElementById("bcTitle").value.trim();
  var msg=document.getElementById("bcMsg").value.trim();
  var pinned=document.getElementById("bcPinned").checked;
  var out=document.getElementById("bcMsg2");
  if(!title||!msg){out.textContent="Title and message required.";out.style.color="#9b1c1c";return;}
  fetch("/api/broadcasts",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,message:msg,pinned})})
    .then(r=>r.json()).then(d=>{
      out.textContent=d.message||"Sent!";out.style.color="#14532d";
      document.getElementById("bcTitle").value="";document.getElementById("bcMsg").value="";
      document.getElementById("bcPinned").checked=false;bcLoad();
      setTimeout(()=>{out.textContent="";},3000);
    }).catch(()=>{out.textContent="Network error.";out.style.color="#9b1c1c";});
}
function bcDelete(id){
  if(!confirm("Delete this broadcast?"))return;
  fetch("/api/broadcasts/"+id,{method:"DELETE",credentials:"same-origin"}).then(()=>bcLoad());
}
bcLoad();
</script>
</body></html>
