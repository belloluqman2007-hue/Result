services:
  - type: web
    name: ameenullah-school
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # ── Database (add your db4free.net values in Render dashboard) ──
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # ── Session secret (generate a random string) ──
      - key: SESSION_SECRET
        generateValue: true
      # ── Admin password (set this in Render dashboard) ──
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      # ── AI Image Generator (optional) ──
      - key: OPENAI_API_KEY
        sync: false
