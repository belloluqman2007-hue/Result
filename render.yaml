services:
  - type: web
    name: ameenullah-school
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
